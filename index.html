<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RutaPay</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos base y limpieza de pantalla */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f111a;
            color: #ffffff;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background-color: #1a1d2e;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-banner {
            background: linear-gradient(135deg, #ff5e62, #ff9966);
            color: #ffffff;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-box {
            background-color: #161826;
            padding: 16px;
            border-radius: 12px;
            text-align: left;
        }
        .stat-title {
            font-size: 14px;
            color: #8b8d9b;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .text-green { color: #4eef90; }
        .text-red { color: #ff5e62; }
        .text-normal { color: #ffffff; }
    </style>
</head>
<body>

<div class="container">
    <!-- Encabezado / Banner de Ingreso Neto -->
    <div class="card card-banner">
        <div style="font-size: 14px; opacity: 0.9;">Ingreso neto</div>
        <div id="ingresoNeto" class="stat-value" style="font-size: 32px; margin: 8px 0;">RD$ 0.00</div>
        <div id="detalleCobroPago" style="font-size: 13px; opacity: 0.9;">Cobras RD$ 0.00 – pagas RD$ 0.00</div>
    </div>

    <!-- Panel de Métricas (Resumen) -->
    <div class="grid-2">
        <div class="stat-box">
            <div class="stat-title">Entregados</div>
            <div id="valEntregados" class="stat-value">0</div>
        </div>

        <div class="stat-box">
            <div class="stat-title">Recibidos</div>
            <div id="valRecibidos" class="stat-value">0</div>
        </div>

        <div class="stat-box">
            <div class="stat-title">Pendientes</div>
            <!-- Muestra 0 en lugar de números negativos si no hay recibidos -->
            <div id="valPendientes" class="stat-value text-normal">0</div>
        </div>

        <div class="stat-box">
            <div class="stat-title">Costo nómina</div>
            <div id="valNomina" class="stat-value">RD$ 0.00</div>
        </div>
    </div>
</div>

<script>
    // Inicialización de datos y cálculo corregido
    function calcularMetricas(datos) {
        let recibidos = Number(datos.recibidos) || 0;
        let entregados = Number(datos.entregados) || 0;
        let cobrado = Number(datos.cobrado) || 0;
        let costoNomina = Number(datos.costoNomina) || 0;

        // LÓGICA CORREGIDA: Si no hay recibidos registrados (o es 0), 
        // los pendientes se quedan en 0 para evitar cifras en negativo (-45).
        let pendientes = 0;
        if (recibidos > 0) {
            pendientes = Math.max(0, recibidos - entregados);
        }

        // Ingreso neto (Cobrado - Nómina)
        let ingresoNeto = cobrado - costoNomina;

        // Actualización de la interfaz
        document.getElementById('valEntregados').innerText = entregados;
        document.getElementById('valRecibidos').innerText = recibidos;
        document.getElementById('valPendientes').innerText = pendientes;
        document.getElementById('valNomina').innerText = 'RD$ ' + costoNomina.toLocaleString('es-DO', { minimumFractionDigits: 2 });
        
        let elNeto = document.getElementById('ingresoNeto');
        elNeto.innerText = 'RD$ ' + ingresoNeto.toLocaleString('es-DO', { minimumFractionDigits: 2 });
        
        document.getElementById('detalleCobroPago').innerText = 
            `Cobras RD$ ${cobrado.toLocaleString('es-DO')} – pagas RD$ ${costoNomina.toLocaleString('es-DO')}`;
    }

    // Ejemplo de prueba automática con tus datos actuales:
    // 45 entregados, 0 recibidos, RD$ 4,050 cobrados, RD$ 6,800 nómina
    window.addEventListener('DOMContentLoaded', () => {
        calcularMetricas({
            entregados: 45,
            recibidos: 0,
            cobrado: 4050,
            costoNomina: 6800
        });
    });
</script>

</body>
</html>
